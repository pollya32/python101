<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 교체 현황 - 설비 부품 교체 관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>

<header class="topbar">
  <div class="d-flex align-items-center gap-2">
    <a href="/" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> 대시보드</a>
    <i class="bi bi-exclamation-triangle-fill"></i>
    <h1>전체 교체 현황</h1>
  </div>
  <div class="d-flex align-items-center gap-2">
    <span id="clock" class="clock"></span>
    <a href="/api/alerts/export" class="btn btn-sm btn-outline-light">
      <i class="bi bi-file-earmark-spreadsheet"></i> CSV 내보내기
    </a>
  </div>
</header>

<main class="container-fluid py-4">

  <div class="legend mb-3">
    <span class="legend-item"><span class="dot dot-overdue"></span> 교체 필요</span>
    <span class="legend-item"><span class="dot dot-soon"></span> 교체 임박</span>
    <span class="legend-item"><span class="dot dot-ok"></span> 정상(예정)</span>
  </div>

  <div class="d-flex justify-content-center gap-2 mb-3">
    <button id="viewListBtn" class="btn btn-sm btn-primary">
      <i class="bi bi-list-ul"></i> 목록
    </button>
    <button id="viewCalendarBtn" class="btn btn-sm btn-outline-primary">
      <i class="bi bi-calendar3"></i> 달력
    </button>
  </div>

  <div id="alertsList" class="alerts-list"></div>

  <div id="calendarView" class="d-none">
    <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
      <button id="calPrevBtn" class="btn btn-sm btn-outline-secondary"><i class="bi bi-chevron-left"></i></button>
      <h5 id="calMonthLabel" class="mb-0"></h5>
      <button id="calNextBtn" class="btn btn-sm btn-outline-secondary"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div id="calWeekdays" class="calendar-weekdays"></div>
    <div id="calGrid" class="calendar-grid"></div>
  </div>

</main>

<div class="modal fade" id="calDayModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="calDayModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="calDayModalList" class="alerts-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/alerts.js"></script>
</body>
</html>
