<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LLM 챗봇 (비용 최적화)</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h2 { margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }
  #chat { border: 1px solid #ddd; border-radius: 8px; padding: 16px; height: 420px; overflow-y: auto; margin-bottom: 12px; background: #fafafa; }
  #chat p { margin: 8px 0; line-height: 1.5; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; }
  #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  button, select { padding: 10px 14px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; }
  .usage { font-size: 12px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <h2>LLM 챗봇</h2>
  <div class="sub">작업 난이도를 선택하면 모델이 자동으로 최적 비용 모델로 라우팅됩니다.</div>

  <div class="row" style="margin-bottom: 10px;">
    <select id="taskLevel">
      <option value="simple">간단 (Haiku · 저렴)</option>
      <option value="balanced" selected>일반 (Sonnet · 균형)</option>
      <option value="complex">복잡 (Opus · 고성능)</option>
    </select>
  </div>

  <div id="chat"></div>

  <div class="row">
    <input id="input" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">전송</button>
  </div>

<script>
const sessionId = crypto.randomUUID();
const chat = document.getElementById('chat');

async function send() {
  const input = document.getElementById('input');
  const taskLevel = document.getElementById('taskLevel').value;
  const message = input.value.trim();
  if (!message) return;
  input.value = '';

  chat.innerHTML += `<p><b>나:</b> ${escapeHtml(message)}</p>`;
  const botLine = document.createElement('p');
  botLine.innerHTML = '<b>Claude:</b> <span class="text"></span><div class="usage"></div>';
  chat.appendChild(botLine);
  const textSpan = botLine.querySelector('.text');
  const usageDiv = botLine.querySelector('.usage');
  chat.scrollTop = chat.scrollHeight;

  const res = await fetch(`/chat/${sessionId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, task_level: taskLevel }),
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const data = JSON.parse(part.slice(6));
      if (data.text) {
        textSpan.textContent += data.text;
        chat.scrollTop = chat.scrollHeight;
      }
      if (data.done) {
        const u = data.usage;
        usageDiv.textContent = `모델: ${data.model} | 입력 ${u.input} / 출력 ${u.output} 토큰 (캐시읽기 ${u.cache_read})`;
      }
    }
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
