{% extends 'base.html' %}
{% block title %}{{ '부품 수정' if part else '부품 등록' }}{% endblock %}
{% block heading %}{{ '부품 수정' if part else '부품 등록' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:960px">
  <form method="post">
    <div class="form-grid">
      <div class="field"><label>부품 ID (QR/RFID 식별자) *</label>
        <input name="part_code" value="{{ part.part_code if part }}" required placeholder="CH-VP-001"></div>
      <div class="field"><label>부품명 *</label>
        <input name="name" value="{{ part.name if part }}" required placeholder="Vacuum Pump"></div>
      <div class="field"><label>카테고리</label>
        <input name="category" value="{{ part.category if part }}" list="cats" placeholder="Pump">
        <datalist id="cats">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist></div>
      <div class="field"><label>장착 장비</label>
        <select name="equipment_id">
          <option value="">(미장착 / 예비)</option>
          {% for e in equipment %}
          <option value="{{ e.id }}" {{ 'selected' if part and part.equipment_id==e.id }}>{{ e.code }} — {{ e.name }}</option>
          {% endfor %}
        </select></div>
      <div class="field"><label>장착일</label>
        <input type="date" name="install_date" value="{{ part.install_date if part else today }}"></div>
      <div class="field"><label>TBM 기대 수명 (일)</label>
        <input type="number" name="expected_life_days" value="{{ part.expected_life_days if part else 180 }}" min="1"></div>
      <div class="field"><label>교체 임계치 (Health Index)</label>
        <input type="number" step="0.1" name="replacement_limit" value="{{ part.replacement_limit if part else 20 }}" min="0" max="99"></div>
      <div class="field"><label>단가 (원)</label>
        <input type="number" name="unit_cost" value="{{ part.unit_cost if part else 0 }}" min="0"></div>
      <div class="field"><label>공급사</label>
        <input name="supplier" value="{{ part.supplier if part }}"></div>
      <div class="field"><label>상태</label>
        <select name="status">
          {% for s in ['사용중','예비','교체예정','교체완료'] %}
          <option value="{{ s }}" {{ 'selected' if part and part.status==s }}>{{ s }}</option>{% endfor %}
        </select></div>
      <div class="field" style="grid-column:1/-1"><label>비고</label>
        <textarea name="note" rows="2">{{ part.note if part }}</textarea></div>
    </div>
    <div style="margin-top:18px; display:flex; gap:10px">
      <button class="btn primary">저장</button>
      <a class="btn ghost" href="{{ url_for('parts') }}">취소</a>
    </div>
  </form>
</div>
{% endblock %}
